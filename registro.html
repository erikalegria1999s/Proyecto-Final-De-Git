<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/registro.css">
    <title>Registro | Tu Curso Soft</title>
</head>
<body>
    <header>
        <nav class="navbar">            
            <div class="nav-izquierda">
                <a href="index.html">
                    <img src="img/Logo.png" alt="Logo Tu Curso Soft" class="logo">
                </a>
                <div class="links-principales">
                    <a href="index.html">Inicio</a>
                    <a href="curso.html">Cursos</a>
                    <a href="nosotros.html">Nosotros</a>
                </div>
            </div>            
            <div class="links-usuario">
                <a href="login.html" class="btn-login">Inicio de Sesión</a>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h2>Crea tu cuenta gratis</h2>
            <p class="auth-subtitulo">Comienza hoy mismo tu ruta hacia el desarrollo web.</p>
            <!-- inicio del formulario -->
            <form action="/registro" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" 
                    id="nombre" name="nombre"
                    placeholder="Juan Pérez" 
                    required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" 
                    id="email" name="email" 
                    placeholder="tu@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" 
                    id="password" name="password"
                    placeholder="Mínimo 8 caracteres" required minlength="8">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" 
                    id="confirm_password" 
                    name="confirm_password" 
                    placeholder="Repite tu contraseña"
                    required minlength="8">
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" 
                    id="terminos" 
                    name="terminos" 
                    required>
                    <label for="terminos">Acepto los <a href="#">Términos de servicio</a> y la <a href="#">Política de privacidad</a>.</label>
                </div>                
            </form>
            <button type="button"onclick="crearCuenta()" class="btn-submit"> Crear Mi Cuenta</button>
            <div class="auth-footer">
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-contenido">
            <p>&copy; 2026 Tu Curso Soft. Todos los derechos reservados.</p>
        </div>
    </footer>

        <script src="js/registro.js"></script>

</body>
</html>
